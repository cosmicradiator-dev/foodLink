<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Food</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="hdr"></header>

    <div class="box">
        <h2>CLAIM FORM</h2>
        <p class="center" id="what"></p>

        <form onsubmit="return submitClaim(event)">
            <div class="grid2">
                <input id="un" type="text" placeholder="Enter Full name" required pattern="[A-Za-z\s]+" title="enter valid name">
                <input id="uph" type="tel" placeholder="Enter Phone number" required pattern="[6-9][0-9]{9}" title="enter valid phone number">
                <input id="um" type="email" placeholder="Enter Email" required title="enter valid email">
                <select id="ut" required>
                    <option value="" disabled selected>Choose Claimer Type</option>
                    <option>NGO</option>
                    <option>Individual</option>
                    <option>Student</option>
                </select>
            </div>
            <div class="center"><button type="submit">Claim Food</button></div>
        </form>
    </div>

    <script src="app.js"></script>
    <script>
        requireRole("ngo");
        showNav();

        // fill the name from the login
        let me = currentUser();
        if(me != null){ document.getElementById("un").value = me.name; }

        let fid = sessionStorage.getItem("fid");
        let food = loadFood();
        let item = food.find(function(x){ return x.id == fid; });

        if(item == null || item.status != "available" || item.approval != "approved"){
            window.location.href = "home.html";
        }else{
            document.getElementById("what").innerHTML =
                "You are claiming: <b>"+esc(item.name)+"</b> ("+item.servings+" servings)";
        }

        function submitClaim(e){
            e.preventDefault();

            // read again, in case someone else claimed it meanwhile
            let list = loadFood();
            let f = list.find(function(x){ return x.id == fid; });
            if(f == null || f.status != "available" || f.approval != "approved"){
                alert("Sorry, this food is no longer available.");
                window.location.href = "home.html";
                return false;
            }

            f.status = "claimed";
            f.code = String(Math.floor(1000 + Math.random()*9000));   // 4-digit pickup code
            f.claimedAt = new Date().toISOString();
            f.claimer = {
                name:  document.getElementById("un").value,
                phone: document.getElementById("uph").value,
                mail:  document.getElementById("um").value,
                type:  document.getElementById("ut").value
            };
            saveFood(list);

            // remember which claims belong to this browser
            let mine = JSON.parse(localStorage.getItem("MYCLAIMS") || "[]");
            mine.push(f.id);
            localStorage.setItem("MYCLAIMS", JSON.stringify(mine));

            window.location.href = "myreg.html";
            return false;
        }
    </script>
</body>
</html>
